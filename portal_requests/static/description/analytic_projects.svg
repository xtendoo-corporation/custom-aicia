<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular -->
  <circle cx="64" cy="64" r="60" fill="#4A90E2" opacity="0.1"/>

  <!-- Carpeta/Proyecto principal -->
  <path d="M28 45 L28 90 C28 93.314 30.686 96 34 96 L94 96 C97.314 96 100 93.314 100 90 L100 52 C100 48.686 97.314 46 94 46 L62 46 L56 40 L34 40 C30.686 40 28 42.686 28 46 L28 45 Z" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>

  <!-- Detalle superior de la carpeta -->
  <path d="M28 45 L28 52 L100 52 L100 48 C100 44.686 97.314 42 94 42 L62 42 L58 46 L34 46 C30.686 46 28 47.343 28 45 Z" fill="#5BA3F5"/>

  <!-- Líneas decorativas dentro de la carpeta -->
  <line x1="40" y1="62" x2="75" y2="62" stroke="#2E5C8A" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="70" x2="88" y2="70" stroke="#2E5C8A" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="78" x2="70" y2="78" stroke="#2E5C8A" stroke-width="2" opacity="0.5"/>

  <!-- Lupa -->
  <g transform="translate(75, 70)">
    <!-- Círculo de la lupa -->
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#2C3E50" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#2C3E50" stroke-width="2.5"/>

    <!-- Mango de la lupa -->
    <line x1="11" y1="11" x2="22" y2="22" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>

    <!-- Reflejo en la lupa -->
    <path d="M -6 -8 Q -4 -10, -2 -8" stroke="#4A90E2" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Sombra de la lupa -->
  <ellipse cx="91" cy="92" rx="8" ry="3" fill="#000000" opacity="0.15"/>
</svg>

